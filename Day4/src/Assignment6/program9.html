<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Program 9</title>
</head>
<body>
	<form>
  <div class="form-group">
    <label for="full-name">Full Name:</label>
    <input type="text" id="full-name" name="full-name" value="Amit Roy" required>
  </div>

  <div class="form-group">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="amit.roy@example.com" required>
  </div>

  <div class="form-group">
    <p>Employee Type:</p>
    <input type="radio" id="salaried" name="employee_type" value="salaried" checked required>
    <label for="salaried">Salaried</label>
    
    <input type="radio" id="business" name="employee_type" value="business" required>
    <label for="business">Own Business</label>
  </div>

  <div class="form-group">
    <label for="subject">Subject:</label>
    <select id="subject" name="subject" required>
      <option value="support">Technical Support</option>
      <option value="sales" selected>Sales Inquiry</option>
      <option value="feedback">General Feedback</option>
    </select>
  </div>

  <div class="form-group">
    <label for="message">Message:</label>
    <textarea id="message" name="message" required>This is the default message text.</textarea>
  </div>

  <div class="form-group">
    <input type="checkbox" id="subscribe" name="subscribe" checked>
    <label for="subscribe">Subscribe to newsletter</label>
  </div>

  <button type="submit">Submit</button>
</form>
</body>
</html>
